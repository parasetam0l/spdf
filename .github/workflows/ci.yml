name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install project generator
        run: brew install xcodegen
      - name: Swift tests
        # Keep timing assertions isolated from unrelated test-suite load.
        timeout-minutes: 18
        run: |
          set -o pipefail
          bash Scripts/dev.sh test --no-parallel 2>&1 | tee Work-test.log
      - name: Generate and validate original fixtures
        run: bash Scripts/dev.sh fixtures
      - name: Build native app without distribution credentials
        run: bash Scripts/dev.sh build Debug > Work-build.log 2>&1
      - name: Native document smoke test
        run: bash Scripts/dev.sh smoke
      - name: Build optimized native app
        run: bash Scripts/dev.sh build Release > Work-release.log 2>&1
      - name: Keep bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-test-diagnostics
          path: |
            Work-test.log
            Work-build.log
            Work-release.log
            Work/Smoke/smoke-test.json
          if-no-files-found: ignore
          retention-days: 7
