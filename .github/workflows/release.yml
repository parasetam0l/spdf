# Builds sPDF Editor signed with Developer ID, notarizes and staples the app
# and DMG, creates a draft GitHub release, and then attaches the Sparkle
# appcast and release manifest before the owner reviews and publishes.
# Runs only when started by hand: Actions → Release → Run workflow.
#
# One-time setup (certificate, secrets, update key): Docs/Releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 (tagged v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      SPDF_TEAM_ID: P7V7795SS9
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::The version must look like 1.2 or 1.2.3, not '$VERSION'."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi

      - name: Check the secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
                      NOTARY_APPLE_ID NOTARY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (see Docs/Releasing.md)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release notes list the commits since the last release
          persist-credentials: false

      - name: Install tools
        run: brew install xcodegen

      - name: Unit tests
        run: swift test

      - name: Build the release tools
        run: |
          swift build -c release --product release-tools
          echo "RELEASE_TOOLS_BIN=$(swift build -c release --show-bin-path)/release-tools" >> "$GITHUB_ENV"

      - name: Import the certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          # A new, higher build number every time.
          xcodebuild archive \
            -project SPDF.xcodeproj \
            -scheme SPDF \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/SPDF.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$SPDF_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$(date +%s)" 2>&1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | { grep -E "error:|warning: .*(sign|entitlement)|ARCHIVE (SUCCEEDED|FAILED)" || true; }
          echo "APP=$RUNNER_TEMP/SPDF.xcarchive/Products/Applications/sPDF Editor.app" >> "$GITHUB_ENV"

      - name: Check the signatures
        run: |
          sparkle="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for bundle in "$APP" "$APP/Contents/Frameworks/Sparkle.framework" \
                        "$sparkle/Autoupdate" "$sparkle/Updater.app" \
                        "$sparkle/XPCServices/Installer.xpc" "$sparkle/XPCServices/Downloader.xpc"; do
            codesign -dvv "$bundle" 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::$bundle is not signed with Developer ID"; exit 1; }
          done
          codesign -dvv "$APP" 2>&1 | grep -q "(runtime)" \
            || { echo "::error::The app is not built with the hardened runtime"; exit 1; }
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::The app carries a debug get-task-allow entitlement"; exit 1
          fi
          identifier="$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          [[ "$identifier" == "com.parasetam0l.spdf" ]] \
            || { echo "::error::Unexpected bundle identifier: $identifier"; exit 1; }
          team="$(codesign -dvv "$APP" 2>&1 | awk -F= '/TeamIdentifier/ {print $2}')"
          [[ "$team" == "$SPDF_TEAM_ID" ]] \
            || { echo "::error::Unexpected team identifier: $team"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/sPDF Editor" | grep -q "arm64" \
            || { echo "::error::The app is not arm64"; exit 1; }
          # Updates are verified with this key; without it none can install.
          key="$(plutil -extract SUPublicEDKey raw -o - "$APP/Contents/Info.plist")"
          [[ "$(printf '%s' "$key" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')" == 32 ]] \
            || { echo "::error::SUPublicEDKey is not a Sparkle public key: $key"; exit 1; }
          feed="$(plutil -extract SUFeedURL raw -o - "$APP/Contents/Info.plist")"
          [[ "$feed" == "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" ]] \
            || { echo "::error::SUFeedURL does not point at this repository's latest appcast: $feed"; exit 1; }

      - name: Notarize the app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/sPDF-Editor-notarize.zip"
          Scripts/notarize.sh "$RUNNER_TEMP/sPDF-Editor-notarize.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build and notarize the DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          dmg="$RUNNER_TEMP/sPDF-Editor-$VERSION.dmg"
          Scripts/make-dmg.sh "$APP" "$dmg" "sPDF Editor $VERSION"
          codesign --sign "Developer ID Application" --timestamp --keychain "$KEYCHAIN" "$dmg"
          Scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg" || true
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Record checksums
        run: |
          shasum -a 256 "$DMG" > "$RUNNER_TEMP/checksums.txt"
          cat "$RUNNER_TEMP/checksums.txt"

      - name: Create the draft release
        run: |
          # GitHub's generated notes list merged pull requests, and this
          # repository is committed to directly: list the commits instead.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            cat <<EOF
          ## Install

          Open sPDF-Editor-$VERSION.dmg and drag sPDF Editor to Applications. The app is signed and notarized; the first launch needs no extra steps.

          **Updating:** published releases offer themselves through Check for Updates… (daily checks once allowed). Automatic installation is off, so every update asks first. From an older version you can also quit sPDF Editor, replace the app with the new copy, and reopen; documents are never touched by replacing the app.

          Requires macOS 14 or later on Apple silicon.

          ## Changes

          EOF
            if [[ -n "$previous" ]]; then
              git log --no-merges --reverse --format='- %s' "$previous..HEAD"
              printf '\n**Full changelog:** https://github.com/%s/compare/%s...v%s\n' "$GITHUB_REPOSITORY" "$previous" "$VERSION"
            else
              echo "First release."
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$DMG" "$RUNNER_TEMP/checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "sPDF Editor $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft
          echo "Draft release created; the appcast job attaches the feed before you publish." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true

  appcast:
    needs: release
    uses: ./.github/workflows/appcast.yml
    with:
      tag: v${{ inputs.version }}
    secrets: inherit
